<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">

    <title>variable-clock-font</title>
    <link rel="stylesheet" href="css/styles.css">

    <script src="js/script.js" type="text/javascript"></script>

</head>

<body onload="setTime()">

    <div class="typographyBG">
        <span id="bg-h1">2</span>
        <span id="bg-h2">3</span>:
        <span id="bg-m1">5</span>
        <span id="bg-m2">9</span>:
        <span id="bg-s1">5</span>
        <span id="bg-s2">9</span>
    </div>

    <div class="typographyFG">
        <span id="fg-h1">2</span>
        <span id="fg-h2">3</span>:
        <span id="fg-m1">5</span>
        <span id="fg-m2">9</span>:
        <span id="fg-s1">5</span>
        <span id="fg-s2">9</span>
    </div>



</body>

</html>
